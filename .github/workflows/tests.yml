name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install lxml
      - name: run tests
        run: python tests/run_all.py
